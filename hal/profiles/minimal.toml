# RP2040-One Minimal Profile
# =======================
# Minimal configuration with 4 keys and encoder

# Import base configuration
base = "../hal_config.toml"

# Profile-specific overrides
[device]
name = "RP2040-One-Keypad-Minimal"
profile = "minimal"
description = "Minimal 4-key layout with encoder"

[switches]
# Minimal switch configuration
switch_1 = {gpio = 1, keycode = "Keycode.ONE", modifier = "Keycode.CONTROL", label = "Ctrl+1", pull = "up", debounce = 10}
switch_2 = {gpio = 2, keycode = "Keycode.TWO", modifier = "Keycode.CONTROL", label = "Ctrl+2", pull = "up", debounce = 10}
switch_3 = {gpio = 3, keycode = "Keycode.THREE", modifier = "Keycode.CONTROL", label = "Ctrl+3", pull = "up", debounce = 10}
switch_4 = {gpio = 4, keycode = "Keycode.FOUR", modifier = "Keycode.CONTROL", label = "Ctrl+4", pull = "up", debounce = 10}

[encoder]
enabled = true
clk_gpio = 11
dt_gpio = 12
sw_gpio = 13
pull = "up"
debounce = 3
scroll_speed = 3
middle_click = false
steps_per_revolution = 24
