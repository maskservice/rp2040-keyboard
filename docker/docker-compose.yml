version: '3.8'

services:
  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "8080:8080"
    networks:
      - keypad-network

  tests:
    build:
      context: ..
      dockerfile: docker/Dockerfile.test
    depends_on:
      - web
    networks:
      - keypad-network
    environment:
      - WEB_URL=http://web:8080

networks:
  keypad-network:
    driver: bridge
